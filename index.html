<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>Regenradar</title>
<style>
  html { font-size: 1px; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, Helvetica, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  #map { position: absolute; left: 0; top: 0; }
  #map img, #map canvas { position: absolute; border: 0; }
  /* 1rem = 1px bei 1080 px Fensterhöhe; html-Schriftgröße wird per JS an die Hoöhe angepasst (4K => 2x) */
  #clock { position: absolute; left: 24rem; bottom: 28rem; padding: 14rem 36rem 18rem; background: rgba(0,0,0,.72); color: #fff; border-radius: 14rem; }
  #time { font-size: 170rem; line-height: 1; font-weight: bold; letter-spacing: 3rem; }
  #sub { font-size: 56rem; margin-top: 8rem; color: #ddd; }
  #flag { display: inline-block; padding: 2rem 22rem; border-radius: 10rem; font-weight: bold; margin-right: 20rem; background: #2e7d32; color: #fff; }
  #flag.fc { background: #f9a825; color: #000; }
  #title { position: absolute; left: 24rem; top: 24rem; padding: 10rem 30rem; background: rgba(0,0,0,.65); color: #fff; font-size: 64rem; border-radius: 14rem; }
  #bar { position: absolute; left: 0; bottom: 0; height: 14rem; width: 100%; background: rgba(255,255,255,.15); }
  #bar div { position: absolute; top: 0; bottom: 0; width: 6rem; background: rgba(255,255,255,.35); }
  #bar div.fc { background: rgba(249,168,37,.6); }
  #bar div.cur { background: #fff; width: 10rem; margin-left: -2rem; }
  #stale { display: none; position: absolute; right: 24rem; top: 24rem; padding: 10rem 28rem; background: #c62828; color: #fff; font-size: 48rem; border-radius: 14rem; }
  #attr { position: absolute; right: 12rem; bottom: 24rem; color: rgba(255,255,255,.75); font-size: 22rem; text-shadow: 0 0 4rem #000; }
  #msg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: #fff; font-size: 64rem; }
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="title"></div>
  <div id="stale">Daten veraltet</div>
  <div id="clock"><div id="time">--:--</div><div id="sub"></div></div>
  <div id="bar"></div>
  <div id="attr">Radar: &copy; Deutscher Wetterdienst (DWD) &middot; Karte: &copy; OpenStreetMap-Mitwirkende</div>
  <div id="msg">Lade Radardaten &hellip;</div>
</div>
<script>
(function () {
  var FRAME_MS = 500;        // Anzeigedauer je Frame
  var HOLD_LAST_MS = 2500;   // Pause am Ende der Schleife
  var RELOAD_MS = 60000;     // frames.json neu laden
  var STALE_MIN = 25;        // Warnung, wenn Daten älter

  var meta = null, imgs = [], cur = 0, timer = null, loadedKey = '';
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function parseIso(s) { // "2026-10-10T15:05:00.000Z"
    var m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+):(\d+)/.exec(s);
    return new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
  }
  // Ortszeit des Browsers; falls die Gerätezeitzone nicht stimmt, hier fest Europe/Berlin erzwingen
  function hhmm(d) {
    try {
      if (window.Intl && Intl.DateTimeFormat) {
        return new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }).format(d);
      }
    } catch (e) {}
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function xhr(url, cb) {
    var r = new XMLHttpRequest();
    r.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + new Date().getTime(), true);
    r.onreadystatechange = function () {
      if (r.readyState !== 4) return;
      if (r.status === 200) { try { cb(null, JSON.parse(r.responseText)); } catch (e) { cb(e); } }
      else cb(new Error('HTTP ' + r.status));
    };
    r.send(null);
  }

  // ---------- Karte aufbauen ----------
  function mapLayout() {
    var W = $('stage').offsetWidth, H = $('stage').offsetHeight;
    var bw = meta.bbox[2] - meta.bbox[0], bh = meta.bbox[3] - meta.bbox[1];
    var s = Math.max(W / bw, H / bh);               // "cover"
    var mw = bw * s, mh = bh * s;
    return { s: s, w: mw, h: mh, x: (W - mw) / 2, y: (H - mh) / 2 };
  }
  var RAD = 6378137, CIRC = 2 * Math.PI * RAD;
  function unit() { return Math.max(0.5, $('stage').offsetHeight / 1080); }
  function applyScale() { document.documentElement.style.fontSize = unit() + 'px'; }
  function build() {
    var u = unit();
    var L = mapLayout(), map = $('map');
    map.style.left = L.x + 'px'; map.style.top = L.y + 'px';
    map.style.width = L.w + 'px'; map.style.height = L.h + 'px';
    map.innerHTML = '';
    var z = meta.zoom, n = Math.pow(2, z), tileM = CIRC / n, i, m, kind, x, y, im;
    var re = /^t_(\d+)_(\d+)_(\d+)\.png$/;
    function addTile(name, m) {
      var tx = +m[2], ty = +m[3];
      var mx0 = -CIRC / 2 + tx * tileM, my1 = CIRC / 2 - ty * tileM; // linke obere Ecke (Mercator-m)
      im = document.createElement('img');
      im.src = 'data/tiles/' + name;
      im.style.left = ((mx0 - meta.bbox[0]) * L.s) + 'px';
      im.style.top = ((meta.bbox[3] - my1) * L.s) + 'px';
      im.style.width = (tileM * L.s + 1) + 'px';
      im.style.height = (tileM * L.s + 1) + 'px';
      return im;
    }
    var base = [], lab = [];
    for (i = 0; i < meta.tiles.length; i++) {
      m = re.exec(meta.tiles[i]); if (!m) continue;
      base.push([meta.tiles[i], m]);
    }
    for (i = 0; i < base.length; i++) map.appendChild(addTile(base[i][0], base[i][1]));
    var shade = document.createElement('div');
    shade.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.35)';
    map.appendChild(shade);
    // Radarframes
    for (i = 0; i < imgs.length; i++) {
      var r = imgs[i]; r.style.left = '0px'; r.style.top = '0px';
      r.style.width = L.w + 'px'; r.style.height = L.h + 'px';
      r.style.opacity = i === cur ? '0.85' : '0';
      map.appendChild(r);
    }
    for (i = 0; i < lab.length; i++) map.appendChild(addTile(lab[i][0], lab[i][1]));
    // Kreise (Radius in Mercator-Metern, Mittelpunkt = Marker)
    var cx = (meta.marker[0] - meta.bbox[0]) * L.s, cy = (meta.bbox[3] - meta.marker[1]) * L.s, ci, cr, cd;
    for (ci = 0; ci < (meta.circles_m || []).length; ci++) {
      cr = meta.circles_m[ci] * L.s; cd = document.createElement('div');
      cd.style.cssText = 'position:absolute;box-sizing:border-box;border-radius:50%;border:' + (4*u) + 'px solid rgba(255,255,255,0.9);box-shadow:0 0 ' + (6*u) + 'px #000, inset 0 0 ' + (6*u) + 'px #000;width:' + (2*cr) + 'px;height:' + (2*cr) + 'px;left:' + (cx - cr) + 'px;top:' + (cy - cr) + 'px';
      map.appendChild(cd);
    }
    // Marker
    var mk = document.createElement('div');
    var px = (meta.marker[0] - meta.bbox[0]) * L.s, py = (meta.bbox[3] - meta.marker[1]) * L.s;
    mk.style.cssText = 'position:absolute;width:' + (18*u) + 'px;height:' + (18*u) + 'px;margin:' + (-11*u) + 'px 0 0 ' + (-11*u) + 'px;border:' + (3*u) + 'px solid #fff;border-radius:50%;background:#e53935;left:' + px + 'px;top:' + py + 'px';
    map.appendChild(mk);
  }

  // ---------- Frames laden ----------
  function frameKey(m) { var k = [], i; for (i = 0; i < m.frames.length; i++) k.push(m.frames[i].file); return k.join('|') + m.tiles.length; }

  function apply(m) {
    var key = frameKey(m);
    var old = {}, i, f;
    for (i = 0; i < imgs.length; i++) old[imgs[i]._file] = imgs[i];
    meta = m;
    var next = [], pending = m.frames.length, started = false;
    function done() {
      if (--pending > 0) return;
      imgs = next; if (cur >= imgs.length) cur = 0;
      build(); renderBar(); $('msg').style.display = 'none';
      if (!started) { started = true; if (!timer) tick(); }
    }
    for (i = 0; i < m.frames.length; i++) {
      f = m.frames[i];
      if (old[f.file]) { next.push(old[f.file]); done(); continue; }
      (function (f) {
        var im = new Image();
        im._file = f.file; im._meta = f;
        im.onload = im.onerror = function () { done(); };
        im.src = 'data/' + f.file;
        next.push(im);
      })(f);
    }
    if (!m.frames.length) $('msg').innerHTML = 'Keine Radardaten vorhanden';
    $('title').innerHTML = m.location || '';
    checkStale();
  }

  function renderBar() {
    var b = $('bar'), i, d, n = meta.frames.length, w = 100 / n;
    b.innerHTML = '';
    for (i = 0; i < n; i++) {
      d = document.createElement('div');
      d.style.left = (i * w) + '%'; d.style.width = (w * 0.8) + '%';
      d.className = meta.frames[i].forecast ? 'fc' : '';
      b.appendChild(d);
    }
  }

  function show(i) {
    var k, f = meta.frames[i], bar = $('bar').childNodes;
    for (k = 0; k < imgs.length; k++) imgs[k].style.opacity = k === i ? '0.85' : '0';
    for (k = 0; k < bar.length; k++) {
      var base = meta.frames[k].forecast ? 'fc' : '';
      bar[k].className = base + (k === i ? ' cur' : '');
    }
    var t = parseIso(f.t);
    $('time').innerHTML = hhmm(t);
    var diff = Math.round((t.getTime() - parseIso(meta.reference).getTime()) / 60000);
    var lab = diff === 0 ? 'aktuell' : (diff > 0 ? 'in ' + diff + ' min' : 'vor ' + (-diff) + ' min');
    $('sub').innerHTML = '<span id="flag" class="' + (f.forecast ? 'fc' : '') + '">' + (f.forecast ? 'Vorhersage' : 'Messung') + '</span>' + lab;
  }

  function tick() {
    if (!imgs.length) { timer = null; return; }
    show(cur);
    var last = cur === imgs.length - 1;
    cur = last ? 0 : cur + 1;
    timer = setTimeout(tick, last ? HOLD_LAST_MS : FRAME_MS);
  }

  function checkStale() {
    var age = (new Date().getTime() - parseIso(meta.reference).getTime()) / 60000;
    $('stale').style.display = age > STALE_MIN ? 'block' : 'none';
  }

  function load() {
    xhr('data/frames.json', function (err, m) {
      if (!err && m && m.frames) apply(m);
      else if (!meta) $('msg').innerHTML = 'Keine Daten (' + (err && err.message) + ')';
      setTimeout(load, RELOAD_MS);
    });
  }
  window.onresize = function () { applyScale(); if (meta) build(); };
  applyScale();
  load();
})();
</script>
</body>
</html>
